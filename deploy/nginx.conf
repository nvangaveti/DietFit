# Nginx Production Reverse Proxy Configuration for DietFit
# Enforces TLS/HTTPS, modern security headers, rate limiting, and database access restrictions.

# Rate limiting zones: 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=dietfit_rate_limit:10m rate=10r/s;

# 1. HTTP Server - Redirect All Unencrypted Traffic to HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name dietfit.example.com;

    # Redirect all HTTP requests to HTTPS with 301 Moved Permanently
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server - Secure Reverse Proxy to Streamlit
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dietfit.example.com;

    # SSL/TLS Certificate Configuration
    ssl_certificate /etc/ssl/certs/dietfit_cert.pem;
    ssl_certificate_key /etc/ssl/private/dietfit_key.pem;

    # Modern TLS Protocols and Cipher Suites (TLSv1.2 & TLSv1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS) - Enforce HTTPS for 1 Year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Modern Browser Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval' wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:;" always;

    # Max File Upload Size: 5MB
    client_max_body_size 5M;

    # =========================================================================
    # RESTRICT DIRECT DATABASE & SENSITIVE FILE ACCESS FROM THE PUBLIC INTERNET
    # =========================================================================
    # Block direct access to JSON database files, environment variables, logs, and git metadata
    location ~* \.(json|sqlite|db|sql|env|key|pem|cert|bak|log)$ {
        deny all;
        return 404;
    }

    location ~* (/\.git|/\.env|/\.streamlit/secrets|/users\.json|/logs) {
        deny all;
        return 404;
    }

    # =========================================================================
    # STREAMLIT WEBSOCKET REVERSE PROXY
    # =========================================================================
    location ^~ /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location ^~ /stream {
        proxy_pass http://127.0.0.1:8501/stream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Main application location
    location / {
        limit_req zone=dietfit_rate_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
